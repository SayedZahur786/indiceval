[project]
name = "indiceval-bench"
version = "0.1.0"
description = "Auditable Hinglish and Indic-language coding and reasoning evaluation"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]
[project.scripts]
indiceval = "indiceval.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/indiceval"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
